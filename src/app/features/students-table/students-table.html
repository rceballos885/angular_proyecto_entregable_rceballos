<div *ngIf="students; else loading">
    <table mat-table [dataSource]="students" class="mat-elevation-z8">

        <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> NOMBRE </th>
            <td mat-cell *matCellDef="let element"> {{element.name | fullname:element.lastname}} </td>
        </ng-container>
        
        <!-- Weight Column -->
        <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef> TELEFONO </th>
            <td mat-cell *matCellDef="let element"> {{element.phone}} </td>
        </ng-container>

        <ng-container matColumnDef="gender">
            <th mat-header-cell *matHeaderCellDef> GENERO </th>
            <td mat-cell *matCellDef="let element"> {{element.gender}} </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef> FECHA DE CREACION </th>
            <td mat-cell *matCellDef="let element"> {{element.createdAt | date:'dd/MM/yyyy'}} </td>
        </ng-container>       

        <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef> DIRECCION </th>
            <td mat-cell *matCellDef="let element"> {{element.address}} </td>
        </ng-container>


        

        <ng-container matColumnDef="main">
            <th mat-header-cell *matHeaderCellDef> ACCION </th>
            <td mat-cell *matCellDef="let element">
                <button matMiniFab aria-label="Example icon button with a delete icon">
                    <mat-icon [matMenuTriggerFor]="menu">more_vert</mat-icon>

                    <mat-menu #menu="matMenu">
                        <button mat-menu-item extended (click)="editStudent(element)">
                            <mat-icon>edit</mat-icon>
                            editar
                        </button>

                        <button mat-menu-item extended (click)="openDialog(element)">
                            <mat-icon>delete</mat-icon>
                            Borrar
                        </button>
                    </mat-menu>
                </button>

            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
</div>
<ng-template #loading>
    <p>Cargando estudiantes...</p>
</ng-template>
